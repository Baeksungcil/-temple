<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#294638"><meta name="description" content="시간에 따라 빛이 바뀌는 작은 카툰 사원"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><title>Temple — 고요한 마당</title></head><body><div id="app"><canvas id="scene" tabindex="0" aria-label="3D 사원. 방향키 또는 WASD로 이동, 마우스나 터치로 회전 및 확대"></canvas><header><a class="brand" href="/">TEMPLE<span>고요한 마당</span></a><div class="clock"><i></i><span id="clock">서울 시간</span></div></header><section class="intro"><span class="eyebrow">A LITTLE PLACE TO PAUSE</span><h1>마음이 쉬어가는<br>작은 사원.</h1><p>천천히 둘러보세요.<br>빛과 그림자가 시간을 따라 흐릅니다.</p><span class="draft">참고 사진 적용 전 · 임시 사원 장면</span></section><nav class="toolbar" aria-label="장면 설정"><label>빛의 시간<select id="time"><option value="live">서울 · 지금</option><option value="day">낮</option><option value="sunset">노을</option><option value="night">밤</option></select></label><button id="reset">처음 시점</button><button id="install" hidden>앱 설치</button><button id="privacy">분석 설정</button></nav><footer>드래그 회전 · 휠 확대 · 우클릭 이동 <span>WASD / 방향키 이동 · 터치 1개 회전 / 2개 확대·이동</span></footer><div class="pad" aria-label="터치 이동"><button data-move="forward" aria-label="앞으로">↑</button><div><button data-move="left" aria-label="왼쪽">←</button><button data-move="back" aria-label="뒤로">↓</button><button data-move="right" aria-label="오른쪽">→</button></div></div><div id="status" role="status">마당을 준비하고 있습니다…</div><div id="error" hidden role="alert"><h2>3D 장면을 열지 못했습니다.</h2><p id="error-text"></p><button onclick="location.reload()">다시 열기</button></div><aside id="consent" hidden aria-label="분석 정보 동의"><h2>이 공간을 더 편안하게</h2><p>필수 기능은 항상 사용할 수 있습니다. 허용하시면 방문 분석을 사용합니다. 선택 전에는 Google 태그를 불러오지 않습니다.</p><button id="accept">분석 허용</button><button id="reject">필수 기능만</button></aside><button id="update" hidden>새 버전 준비됨 · 업데이트</button></div><script type="module" src="/src/main.js"></script></body></html>
